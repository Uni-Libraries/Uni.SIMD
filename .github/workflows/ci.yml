name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Release
            runner: ubuntu-26.04
            compiler: g++
            build_type: Release
            sanitizers: "OFF"
          - name: Clang Release
            runner: ubuntu-26.04
            compiler: clang++
            build_type: Release
            sanitizers: "OFF"
          - name: GCC Sanitizers
            runner: ubuntu-26.04
            compiler: g++
            build_type: RelWithDebInfo
            sanitizers: "ON"
          - name: Apple Clang Release (macOS 26)
            runner: macos-26
            compiler: clang++
            build_type: Release
            sanitizers: "OFF"
          - name: Apple Clang Release (macOS 26 Intel)
            runner: macos-26-intel
            compiler: clang++
            build_type: Release
            sanitizers: "OFF"

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.runner, 'ubuntu-')
        run: sudo apt-get update && sudo apt-get install --yes libfmt-dev ninja-build

      - name: Install dependencies (macOS)
        if: startsWith(matrix.runner, 'macos-')
        run: brew install fmt ninja

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DUNI_SIMD_BUILD_TESTS=ON
          -DUNI_SIMD_BUILD_BENCHMARKS=ON
          -DUNI_SIMD_ENABLE_SANITIZERS=${{ matrix.sanitizers }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Benchmark smoke test
        run: build/src_benchmark/uni_simd_benchmark --iterations 2 --warmup 1
